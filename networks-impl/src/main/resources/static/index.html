<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Networks</title>

  <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet">

  <link
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
      rel="stylesheet">
</head>

<body class="bg-dark">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-primary text-white">
          Actions
        </div>
        <div class="card-body d-flex flex-column">
          <!-- Global Database Operations -->
          <h5 class="card-title">Database Actions</h5>

          <p class="card-text mt-3">Click the buttons below to perform actions on the database</p>

          <button id="generateNodesButton" class="btn btn-warning mt-2 text-left">
            Generate Nodes
          </button>

          <button id="generateLeftSplitNodesButton" class="btn btn-warning mt-2 text-left">
            Generate Nodes (Left Split)
          </button>

          <button id="generateRightSplitNodesButton" class="btn btn-warning mt-2 text-left">
            Generate Nodes (Right Split)
          </button>

          <button id="displayGraphButton" class="btn btn-info mt-2 text-left">Display Graph</button>

          <button id="deleteButton" class="btn btn-danger mt-2 text-left">Delete Graph</button>

          <!-- Like CRUD Operations -->
          <h5 class="card-title mt-4">Like Actions</h5>
          <p class="card-text mt-3">Perform like-specific operations</p>

          <button id="createLikeButton" class="btn btn-success mt-2 text-left">
            Create Like
          </button>

          <button id="getAllLikesButton" class="btn btn-info mt-2 text-left">
            Get Liked Posts
          </button>

          <button id="updateLikeDateButton" class="btn btn-warning mt-2 text-left">
            Update Liked Post
          </button>

          <button id="deleteLikeButton" class="btn btn-danger mt-2 text-left">
            Delete Like
          </button>

          <!-- Friendship CRUD Operations -->
          <h5 class="card-title mt-4">Friendship Actions</h5>
          <p class="card-text mt-3">Perform friendship-specific operations</p>

          <button id="createFriendshipButton" class="btn btn-success mt-2 text-left">
            Create Friendship
          </button>

          <button id="getAllFriendshipsButton" class="btn btn-info mt-2 text-left">
            Get Friendships
          </button>

          <button id="updateFriendshipDateButton" class="btn btn-warning mt-2 text-left">
            Update Friendship Date
          </button>

          <button id="deleteFriendshipButton" class="btn btn-danger mt-2 text-left">
            Delete Friendship
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Cytoscape container -->
  <div id="cy-parent" class="row justify-content-center mt-3 mb-3">
    <div class="col-md-12">
      <div id="cy" style="width: 100%; height: 500px;"></div>
    </div>
  </div>
</div>

<!-- Loading Modal -->
<div class="modal fade" id="loadingModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-body text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="sr-only">Loading...</span>
        </div>
        <p class="mt-3">Loading...</p>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.20.0/cytoscape.min.js"></script>
<script src="js/globalApi.js"></script>
<script src="js/friendshipApi.js"></script>
<script src="js/likeApi.js"></script>

<script>
  $(document).ready(() => {
    // Global database operations
    onGenerateNodesClick();
    onGenerateLeftSplitNodesClick();
    onGenerateRightSplitNodesClick();
    onDisplayGraphClick();
    onDeleteGraphClick();

    // Like CRUD operations
    onCreateLikeClick();
    onGetAllLikesClick();
    onUpdateLikeDateClick();
    onDeleteLikeClick();

    // Friendship CRUD operations
    onCreateFriendshipClick();
    onGetAllFriendshipsClick();
    onUpdateFriendshipDateClick();
    onDeleteFriendshipClick();
  });
</script>

</body>

</html>
