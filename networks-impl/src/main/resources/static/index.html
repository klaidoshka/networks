<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Networks</title>
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
  <style>
    body {
      background-color: #343a40;
      color: #ffffff;
    }

    .card, .modal-content {
      background-color: #495057;
      color: #ffffff;
    }

    .btn {
      color: #ffffff;
    }
    
    #display {
      background-color: #495057;
      border-radius: 3px;
      color: #ffffff;
    }
    
    #display h3 {
      margin-left: 20px;
    }
    
    #display table {
      color: #ffffff;
    }
  </style>
</head>
<body>
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header">
          Actions
        </div>
        <div class="card-body">
          <!-- Global Database Operations -->
          <div class="mb-4">
            <h5>Database Actions</h5>
            <p>These are performed on the whole graph</p>
            <button id="generateNodesButton" class="btn btn-success mt-2">Generate Nodes</button>
            <button id="generateLeftSplitNodesButton" class="btn btn-success mt-2">Generate Nodes
              (Left Split)
            </button>
            <button id="generateRightSplitNodesButton" class="btn btn-success mt-2">Generate Nodes
              (Right Split)
            </button>
            <button id="displayGraphButton" class="btn btn-info mt-2">Show / Hide</button>
            <button id="deleteButton" class="btn btn-danger mt-2">Delete</button>
          </div>

          <!-- Like CRUD Operations -->
          <div class="mb-4">
            <h5>"Like" Actions</h5>
            <p>These are performed only around label "Like"</p>
            <button id="createLikeButton" class="btn btn-success mt-2">Create</button>
            <button id="getAllLikesButton" class="btn btn-info mt-2">Show / Hide</button>
            <button id="updateLikeDateButton" class="btn btn-warning mt-2">Update</button>
            <button id="deleteLikeButton" class="btn btn-danger mt-2">Delete</button>
          </div>

          <!-- Friendship CRUD Operations -->
          <div class="mb-2">
            <h5>"Friendship" Actions</h5>
            <p>These are performed only around label "Friendship"</p>
            <button id="createFriendshipButton" class="btn btn-success mt-2">Create</button>
            <button id="getAllFriendshipsButton" class="btn btn-info mt-2">Show / Hide</button>
            <button id="updateFriendshipDateButton" class="btn btn-warning mt-2">Update</button>
            <button id="deleteFriendshipButton" class="btn btn-danger mt-2">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Display container -->
  <div id="display-parent" class="row justify-content-center mt-3">
    <div class="col-md-12 ">
      <div id="display"></div>
    </div>
  </div>
</div>

<!-- Loading Modal -->
<div class="modal fade" id="loadingModal" tabindex="-1" role="dialog" aria-labelledby="loadingModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-body text-center">
        <div class="loader"></div>
        <p class="mt-3">Loading...</p>
      </div>
    </div>
  </div>
</div>

<!-- Forms Modals -->
<div class="modal fade" id="formModal" tabindex="-1" role="dialog" aria-labelledby="formModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="formModalTitle"></h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form id="formModalForm">
          <!-- Form fields will be injected here -->
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="formModalSubmit">Submit</button>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.20.0/cytoscape.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/globalApi.js"></script>
<script src="js/friendshipApi.js"></script>
<script src="js/likeApi.js"></script>

<script>
  $(document).ready(() => {
    // Global database operations
    onGenerateNodesClick();
    onGenerateLeftSplitNodesClick();
    onGenerateRightSplitNodesClick();
    onDisplayGraphClick();
    onDeleteGraphClick();

    // Like CRUD operations
    onCreateLikeClick();
    onGetAllLikesClick();
    onUpdateLikeDateClick();
    onDeleteLikeClick();

    // Friendship CRUD operations
    onCreateFriendshipClick();
    onGetAllFriendshipsClick();
    onUpdateFriendshipDateClick();
    onDeleteFriendshipClick();
  });
</script>
</body>
</html>
